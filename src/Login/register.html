<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../input.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">

  <style>
    .row {
      display: flex;
      gap: 12px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 15px;
      margin-bottom: 0px;
      font-size: 0.9em;
      text-align: left;
    }

    .checkbox-container input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="center-screen">
    <form action="../Employee/catalog.html" style="width: 22em;" class="login-panel">
      <h2 style="text-align:center; margin-bottom:18px;">Rejestracja</h2>

      <div class="row">
        <div style="flex:1">
          <label for="firstName">Imię</label>
          <input id="firstName" name="firstName" type="text" placeholder="Imię" autocomplete="given-name">
        </div>
        <div style="flex:1">
          <label for="lastName">Nazwisko</label>
          <input id="lastName" name="lastName" type="text" placeholder="Nazwisko" autocomplete="family-name">
        </div>
      </div>

      <div>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="adres@example.com" autocomplete="email">
      </div>

      <div>
        <label for="password">Hasło</label>
        <input id="password" name="password" type="password" placeholder="Hasło" autocomplete="new-password">
      </div>

      <div>
        <label for="cardNumber">Numer karty</label>
        <input id="cardNumber" name="cardNumber" type="tel" inputmode="numeric" placeholder="Numer karty"
          autocomplete="cc-number">
      </div>

      <div class="row">
        <div style="flex:1">
          <label for="exp">Data wygaśnięcia</label>
          <input id="exp" name="exp" type="month" placeholder="MM/YY" autocomplete="cc-exp">
        </div>
        <div style="flex:1">
          <label for="cvv">CVV</label>
          <input id="cvv" name="cvv" type="tel" inputmode="numeric" pattern="[0-9]{3,4}" placeholder="CVV"
            autocomplete="cc-csc">
        </div>
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="privacyPolicy" name="privacyPolicy">
        <a id="privacyPolicyLabel" href="../privacy_policy.html">Akceptuję regulamin i politykę prywatności.</a>
      </div>

      <button type="submit">Zarejestruj się</button>
      <p class="muted">Masz już konto? <a href="login_index.html">Zaloguj się</a></p>
    </form>
  </div>
</body>

</html>
