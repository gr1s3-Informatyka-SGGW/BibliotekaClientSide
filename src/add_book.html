<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dodaj książkę</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="input.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="add_book.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <script src="sidebar.js"></script>
  <script defer src="mode_switcher.js"></script>
  <script src="popup.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      const selectElements = document.getElementsByClassName("add-container")[0].querySelectorAll('select');
      selectElements.forEach(child => {
        child.value = '';
        child.addEventListener('change', function () {
          if (this.value.startsWith("Dodaj")) {
            showPopup('add_to_select');
            this.value = '';
          }
        });
      });
    });
  </script>

  <div class="content">
    <h1><img src="assets/add_box.svg"></img> Dodaj książkę</h1>

    <div class="add-container">
      <div class="panel book-info">
        <h3 class="header"><img src="assets/book.svg"> Informacje o książce</h3>

        <div class="form-grid">

          <div class="form-row">
            <div class="form-group">
              <label for="title">Tytuł:</label>
              <input type="text" id="title">
            </div>

            <div class="form-group">
              <label for="isbn">ISBN:</label>
              <div id="isbn-container">
                <input type="text" id="isbn">
              </div>
            </div>
          </div>
          <label for="author-select">Autorzy:</label>
          <div class="multi-select-container">
            <div class="chip">
              J.R.R. Tolkien
              <span class="chip-close">x</span>
            </div>
            <div class="chip">
              C.S. Lewis
              <span class="chip-close">x</span>
            </div>
            <select id="author-select">
              <option disabled selected value="">Wybierz lub wpisz nowego autora</option>
              <option>Dodaj...</option>
              <option>Adam Mickiewicz</option>
              <option>Henryk Sienkiewicz</option>
            </select>
            <div class="chip add">Dodaj</div>
          </div>

          <label for="genre-select">Gatunki:</label>
          <div class="multi-select-container">
            <div class="chip">
              Fantasy
              <span class="chip-close">x</span>
            </div>
            <div class="chip">
              Przygodowy
              <span class="chip-close">x</span>
            </div>
            <select id="genre-select">
              <option disabled selected value="">Wybierz lub wpisz nowy gatunek</option>
              <option>Dodaj...</option>
              <option>Science Fiction</option>
              <option>Kryminał</option>
              <option>Horror</option>
            </select>
            <div class="chip add">Dodaj</div>
          </div>

          <label for="tag-select">Tagi:</label>
          <div class="multi-select-container">
            <div class="chip">
              morderstwo
              <span class="chip-close">x</span>
            </div>
            <div class="chip">
              słodkie kotki
              <span class="chip-close">x</span>
            </div>
            <select id="tag-select">
              <option disabled selected value="">Wybierz lub wpisz nowy tag</option>
              <option>Dodaj...</option>
              <option>natura</option>
              <option>nauka</option>
              <option>horror</option>
            </select>
            <div class="chip add">Dodaj</div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="year">Rok wydania:</label>
              <input type="number" id="year" min="1000" max="2100">
            </div>

            <div class="form-group">
              <label for="copies">Liczba egzemplarzy:</label>
              <input type="number" id="copies" min="1" value="1">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="publisher-select">Wydawca:</label>
              <select id="publisher-select">
                <option disabled selected value="">Wybierz lub wpisz nowego wydawcę</option>
                <option>Dodaj...</option>
                <option>Wydawca A</option>
                <option>Wydawca B</option>
                <option>Wydawca C</option>
              </select>
            </div>

            <div class="form-group">
              <label for="language-select">Język:</label>
              <select id="language-select">
                <option disabled selected value="">Wybierz lub wpisz nowy język</option>
                <option>Dodaj...</option>
                <option>senegalski</option>
                <option>mongolski</option>
                <option>peruwiański</option>
              </select>
            </div>
          </div>
        </div>

        <button onclick="showPopup('book_copies_added')"><img src="assets/save.svg"></img>&nbspDodaj książkę</button>
      </div>
    </div>

  </div>
</body>

</html>
